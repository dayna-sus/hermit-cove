name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show build outputs
        run: |
          echo "=== repo root ==="
          ls -la
          echo "=== client-dist (if present) ==="
          ls -la client-dist || true
          echo "=== client/client-dist (if present) ==="
          ls -la client/client-dist || true

      - name: Prepare Pages artifact folder
        run: |
          rm -rf pages-dist
          if [ -d "client/client-dist" ]; then
            cp -R "client/client-dist" pages-dist
          elif [ -d "client-dist" ]; then
            cp -R "client-dist" pages-dist
          else
            echo "No build output folder found (expected client-dist or client/client-dist)"
            exit 2
          fi
          echo "=== pages-dist ==="
          ls -la pages-dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
